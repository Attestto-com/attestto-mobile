<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0a0b0f">
  <title>Attestto — Recibir credencial</title>
  <!--
    Hosted export receiver (mobile.attestto.com/export.html). Opened over HTTPS
    by scanning the desktop's export QR. Generates THIS device's own Ed25519
    signing key (its did:key), rendezvous with the desktop through the blind
    relay, requests the credential, and stores the re-issued VC bound to this
    device's key. The desktop re-signs to this did:key — no private key ever
    crosses the wire. The signing key persists locally so the device can present
    later. v1 binding; did:sns anchor registration is the later upgrade.
    Query: ?relay=wss://<relay>&sid=<sessionId>&pk=<desktopPubHex>
  -->
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0a0b0f;color:#fff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
    .brand{font-size:1.25rem;font-weight:700;margin-bottom:24px}
    .brand .to{color:#7c3aed}
    .card{width:100%;max-width:420px;background:#161822;border:1px solid #262a38;border-radius:16px;padding:24px;text-align:center}
    .spinner{width:40px;height:40px;border:4px solid #262a38;border-top-color:#7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin:16px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:.9rem;color:#a0a0b0;margin-top:8px}
    .result-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:2rem}
    .ok{background:rgba(34,197,94,.15);color:#22c55e}
    .bad{background:rgba(239,68,68,.15);color:#ef4444}
    h2{font-size:1.15rem;margin-bottom:4px}
    .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #262a38;font-size:.85rem;text-align:left}
    .row .k{color:#8b8fa3}
    .row .v{color:#fff;word-break:break-all;text-align:right}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:600;margin:2px}
    .b-ok{background:rgba(34,197,94,.15);color:#22c55e}
    .b-bad{background:rgba(239,68,68,.15);color:#ef4444}
    .details{margin-top:16px}
  </style>
</head>
<body>
  <div class="brand">attest<span class="to">to</span></div>
  <div class="card" id="card">
    <div class="spinner"></div>
    <div class="status" id="status">Conectando…</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js" integrity="sha384-05+sicyRJQ56XpL4U9HJ8YbtSzFDvAg7apPKOGV6A0JsAJKFM68jp5oLnUjG5mEp" crossorigin="anonymous"></script>
  <script>
    const Q = new URLSearchParams(location.search);
    const RELAY = Q.get('relay') || '';
    const SID = Q.get('sid') || '';
    const DESKTOP_PK_HEX = Q.get('pk') || '';
    let ws, sharedKey = null, myDid = '';

    const $ = id => document.getElementById(id);
    const setStatus = t => { const s = $('status'); if (s) s.textContent = t; };
    const fail = t => { $('card').innerHTML = '<div class="result-icon bad">!</div><h2>Error</h2><div class="status">' + esc(t) + '</div>'; };

    function hexToBytes(h){const a=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)a[i/2]=parseInt(h.substr(i,2),16);return a}
    function bytesToHex(b){return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('')}
    function bytesToB64url(b){let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
    function b64urlToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
    async function sha256hex(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return bytesToHex(new Uint8Array(buf))}
    function jcs(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(jcs).join(',')+']';const ks=Object.keys(v).filter(k=>v[k]!==undefined).sort();return '{'+ks.map(k=>JSON.stringify(k)+':'+jcs(v[k])).join(',')+'}'}
    function didKeyToPub(did){const m=/^did:key:z(.+)$/.exec(did||'');if(!m)return null;const b=b64urlToBytes(m[1]);if(b[0]!==0xed||b[1]!==0x01)return null;return b.slice(2)}
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

    // This device's own signing identity (persisted so it can present later).
    function loadOrCreateSigningKey(){
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem('attestto:signing-key') || 'null'); } catch(e){}
      if (stored && stored.did && stored.secretKey) return stored;
      const kp = nacl.sign.keyPair();
      const did = 'did:key:z' + bytesToB64url(new Uint8Array([0xed,0x01,...kp.publicKey]));
      const rec = { did, secretKey: bytesToHex(kp.secretKey) };
      try { localStorage.setItem('attestto:signing-key', JSON.stringify(rec)); } catch(e){}
      return rec;
    }

    // Verify the desktop's issuer signature on the re-issued VC.
    async function verifyIssuer(vc){
      const p = vc.proof || {};
      const body = { '@context':vc['@context'], type:vc.type, issuer:vc.issuer, issuanceDate:vc.issuanceDate, credentialSubject:vc.credentialSubject, evidence:vc.evidence };
      const proofInput = { '@context':vc['@context'], type:'Ed25519Signature2020', created:p.created, verificationMethod:p.verificationMethod, proofPurpose:p.proofPurpose, vcHash: await sha256hex(jcs(body)) };
      const pub = didKeyToPub(vc.issuer);
      try { return !!pub && !!p.proofValue && nacl.sign.detached.verify(new TextEncoder().encode(jcs(proofInput)), b64urlToBytes(p.proofValue), pub); } catch(e){ return false; }
    }

    function storeCredential(vc){
      let list = [];
      try { list = JSON.parse(localStorage.getItem('attestto:credentials') || '[]'); } catch(e){}
      list.push(vc);
      try { localStorage.setItem('attestto:credentials', JSON.stringify(list)); } catch(e){}
    }

    function credType(vc){const t=Array.isArray(vc&&vc.type)?vc.type:[];return t.find(x=>x!=='VerifiableCredential')||'Credencial'}
    function subjName(vc){const s=(vc&&vc.credentialSubject)||{};return s.nombre||s.name||''}

    async function onCredential(vc){
      const issuerOk = await verifyIssuer(vc);
      const boundOk = (vc.credentialSubject||{}).id === myDid;
      if (issuerOk && boundOk) storeCredential(vc);
      const name = subjName(vc);
      const pass = issuerOk && boundOk;
      $('card').innerHTML =
        '<div class="result-icon '+(pass?'ok':'bad')+'">'+(pass?'✓':'!')+'</div>'+
        '<h2>'+(pass?'Credencial recibida':'No se pudo guardar')+'</h2>'+
        '<div class="status">'+esc(credType(vc))+(name?(' · '+esc(name)):'')+'</div>'+
        '<div class="details">'+
          '<div class="row"><span class="k">Firma del emisor</span><span class="v"><span class="badge '+(issuerOk?'b-ok':'b-bad')+'">'+(issuerOk?'válida':'inválida')+'</span></span></div>'+
          '<div class="row"><span class="k">Ligada a este dispositivo</span><span class="v"><span class="badge '+(boundOk?'b-ok':'b-bad')+'">'+(boundOk?'sí':'no')+'</span></span></div>'+
          '<div class="row"><span class="k">Tu DID</span><span class="v">'+esc(myDid)+'</span></div>'+
        '</div>';
      if(pass) setTimeout(()=>{ location.href='https://mobile.attestto.com'; }, 4000);
    }

    function sendEncrypted(obj){
      const nonce=nacl.randomBytes(24);
      const ct=nacl.secretbox(new TextEncoder().encode(JSON.stringify(obj)),nonce,sharedKey);
      ws.send(JSON.stringify({type:'encrypted',nonce:bytesToHex(nonce),data:bytesToHex(ct)}));
    }

    function connect(){
      if(!RELAY||!SID||!DESKTOP_PK_HEX){ fail('Enlace incompleto. Escaneá el código QR de nuevo.'); return; }
      myDid = loadOrCreateSigningKey().did;
      const url = RELAY.replace(/\/$/,'') + '/r/' + encodeURIComponent(SID);
      ws=new WebSocket(url);
      ws.onopen=()=>setStatus('Esperando al escritorio…');
      ws.onmessage=async (e)=>{
        let msg;try{msg=JSON.parse(e.data)}catch{return}
        if(msg.type==='peer-joined'){
          setStatus('Estableciendo canal cifrado…');
          const kp=nacl.box.keyPair();
          sharedKey=nacl.box.before(hexToBytes(DESKTOP_PK_HEX),kp.secretKey);
          ws.send(JSON.stringify({type:'key-exchange',publicKey:bytesToHex(kp.publicKey)}));
        } else if(msg.type==='key-exchange-ack'){
          setStatus('Solicitando credencial…');
          sendEncrypted({type:'request-export',holderDid:myDid});
        } else if(msg.type==='encrypted'&&sharedKey){
          const pt=nacl.secretbox.open(hexToBytes(msg.data),hexToBytes(msg.nonce),sharedKey);
          if(!pt)return;
          let inner;try{inner=JSON.parse(new TextDecoder().decode(pt))}catch{return}
          if(inner.type==='credential') onCredential(inner.vc);
        } else if(msg.type==='peer-gone'){
          setStatus('El escritorio se desconectó.');
        }
      };
      ws.onerror=()=>setStatus('Error de conexión con el relay.');
      ws.onclose=(ev)=>{ if(ev.code===4003) fail('Sesión ocupada.'); };
    }
    connect();
  </script>
</body>
</html>
